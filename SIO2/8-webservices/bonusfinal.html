
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Mon Pokédex</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card {width: 200px;position: relative;transition: transform 0.3s, box-shadow 0.3s;}
        @keyframes fadeIn {from {opacity: 0;}to {opacity: 1;}}
        .colonne-pokemon:has(.card:hover) {position: relative;z-index: 1000;}/* La colonne passe au premier plan */
        .card:hover {transform: scale(1.1);cursor: pointer;box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);}
        .description {display: none;position: absolute;top: 100%;
            left: 0;            width: 100%;
            background-color: white;padding: 12px;border: 1px solid rgba(0, 0, 0, 0.125);border-radius: 0.375rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);text-align: left;z-index: 1001;
        }
        .card:hover .description {display: block;}
    </style>
</head>

<body class="bg-light">
    <div class="container py-4">
        <h1 class="text-center text-danger mb-4">
            Mon Pokédex
        </h1>
        <div id="pokemon" class="row g-3"></div>
    </div>
    <script>
        fetch("https://pokeapi.co/api/v2/pokemon?limit=2000")
        .then(response => response.json())
        .then(data => {
            data.results.forEach((p, index) => {
                fetch(p.url)
                .then(response => response.json())
                .then(details => {
                    setTimeout(() => {
                        const colonne = document.createElement("div");
                        colonne.className = "col-6 col-md-3 col-lg-2 colonne-pokemon";
                        colonne.innerHTML = `
                            <div class="card text-center shadow-sm">
                                <img src="${details.sprites.front_default}"
                                     class="card-img-top mx-auto"
                                     style="width: 90px;">
                                <div class="card-body p-2">
                                    <h6 class="text-capitalize mb-0">
                                        ${p.name}
                                    </h6>
                                </div>
                                <div class="description">
                                    <h6>Titre</h6>
                                    <p>Description</p>
                                </div>
                            </div>
                        `;
                        colonne.style.opacity = "0";
                        colonne.style.animation = "fadeIn 1s ease forwards";
                        document.getElementById("pokemon").appendChild(colonne);
                    }, index * 200);
                });
            });
        });
    </script>
</body>
</html>
